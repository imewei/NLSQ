{% set name = "evosax" %}
{% set version = "0.3.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/65/2d/3408839c2151b576ffa2fd53cb1e80ab335b6845f0bc9248884dfc79524c/evosax-{{ version }}.tar.gz
  sha256: 38609f64704b48921b500b2d4729779beacd82eb39749978fe8e6db790a790dc

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=61
    - wheel
  run:
    - python >=3.10
    - numpy >=1.25
    - jax >=0.5.0
    - flax >=0.10.0
    - dotmap
    - matplotlib-base

test:
  imports:
    - evosax
  # pip check omitted: evosax's METADATA lists dev/examples extras (pytest,
  # torch, brax, gymnax) as conditional Requires-Dist; pip check would flag
  # those absent packages even though they are not runtime requirements.

about:
  home: https://github.com/RobertTLange/evosax
  summary: Evolution Strategies in JAX
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  doc_url: https://github.com/RobertTLange/evosax
  dev_url: https://github.com/RobertTLange/evosax

extra:
  recipe-maintainers:
    - imewei
