{% set name = "evosax" %}
{% set version = "0.3.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/bd/51/169959bbbaf400d500e71c41635e22f9b11cdfc4ba2ebeb576cc4567a9a1/evosax-{{ version }}.tar.gz
  sha256: c5d85711785313a96781bb92bd76c7f433fbc4bd7f883bfa8d9e2fa0a34e9725

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=61
    - wheel
  run:
    - python >=3.10
    - numpy >=1.25
    - jax >=0.5.0
    - flax >=0.10.0
    - dotmap
    - matplotlib-base

test:
  imports:
    - evosax
  # pip check omitted: evosax's METADATA lists dev/examples extras (pytest,
  # torch, brax, gymnax) as conditional Requires-Dist; pip check would flag
  # those absent packages even though they are not runtime requirements.

about:
  home: https://github.com/RobertTLange/evosax
  summary: Evolution Strategies in JAX
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  doc_url: https://github.com/RobertTLange/evosax
  dev_url: https://github.com/RobertTLange/evosax

extra:
  recipe-maintainers:
    - imewei
