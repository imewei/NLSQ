{% set name = "nlsq" %}
{% set version = "0.7.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/38/b8/0b31a71d00597c5c657f3aa3955fa0b9ae87075c400635e60ba711f6e9a5/nlsq-{{ version }}.tar.gz
  sha256: 66cbcc6af3cace85b03dca06b0cce14c273178ca58985327c7655b19ff570814

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - nlsq = nlsq.cli.main:main
    - nlsq-gui = nlsq.gui_qt:run_desktop

requirements:
  host:
    - python >=3.12
    - pip
    - setuptools >=80
    - setuptools-scm >=9.2
    - wheel
  run:
    # Core scientific computing
    - python >=3.12
    - numpy >=2.2
    - scipy >=1.16.0
    # JAX ecosystem (conda-forge)
    - jax >=0.8.0
    - jaxlib >=0.8.0
    - optax >=0.2.6
    # Visualization and monitoring
    - matplotlib-base >=3.10.0
    - psutil >=7.2.0
    - tqdm >=4.67.0
    # Large dataset support
    - h5py >=3.15.0
    # Performance
    - python-xxhash >=3.6.0
    # Configuration
    - pyyaml >=6.0.3
    # Global optimization -- built and hosted on imewei channel
    - evosax >=0.2.0
    # Qt GUI -- both available on conda-forge
    # pyside6: latest on conda-forge is 6.9.3 (relaxed from >=6.10.0 for conda)
    - pyside6 >=6.4.0
    - pyqtgraph >=0.14.0

test:
  imports:
    - nlsq
  # pip check is intentionally omitted: the installed METADATA lists dev/docs
  # extras as unconditional Requires-Dist (pyproject.toml currently includes dev
  # deps in core dependencies). pip check would always fail on conda-only envs.
  commands:
    - nlsq --help

about:
  home: https://github.com/imewei/NLSQ
  summary: GPU/TPU accelerated nonlinear least-squares curve fitting using JAX
  license: MIT
  license_family: MIT
  license_file: LICENSE
  doc_url: https://nlsq.readthedocs.io
  dev_url: https://github.com/imewei/NLSQ

extra:
  recipe-maintainers:
    - imewei
