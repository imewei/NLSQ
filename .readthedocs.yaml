# ReadTheDocs configuration for NLSQ
# Updated: 2026-11-01
# Requires: Python 3.12+ (tested on 3.13), Sphinx 9.2.0, JAX 0.12.0.1, NumPy 2.5.4, SciPy 1.18.1
# Doc tooling is pinned in docs/requirements.txt (floors mirror the `dev` dependency
# group); the `gui` extra supplies PySide6 for autodoc of nlsq.gui_qt.
#
# Documentation Quality: Zero warnings policy enforced (fail_on_warning: true)

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"  # Aligned with pyproject.toml requires-python >=3.12, tested on 3.13
  apt_packages:
    - graphviz
  jobs:
    pre_build:
      - echo "Building NLSQ documentation..."
      - echo "This build requires Sphinx 9.2.0, JAX 0.12.0.1, NumPy 2.5.4, SciPy 1.18.1"
    post_build:
      - echo "Documentation build complete"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true  # Zero warnings policy - all warnings resolved (2025-10-31)
  builder: html

formats:
  - htmlzip

python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
      extra_requirements:
        - gui
