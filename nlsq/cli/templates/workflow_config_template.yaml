# ==============================================================================
# NLSQ Workflow Configuration Template
# ==============================================================================
# Version: 7.1 (every key below is read by the current CLI — no
#                documented-but-dead configuration; keep it that way if you
#                edit this file alongside nlsq/cli/*.py)
#
# This template provides configuration options for NLSQ curve fitting workflows.
# Copy this file to your project and customize as needed.
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ CLI USAGE                                                                   │
# ├─────────────────────────────────────────────────────────────────────────────┤
# │ Single fit:    nlsq fit workflow.yaml                                       │
# │ Batch fits:    nlsq batch w1.yaml w2.yaml w3.yaml --workers 4               │
# │                nlsq batch configs/*.yaml --summary batch_summary.json       │
# │ System info:   nlsq info                                                    │
# │ Get template:  nlsq config --workflow                                       │
# └─────────────────────────────────────────────────────────────────────────────┘
#
# Quick Start:
#   1. Copy this file: cp workflow_config_template.yaml my_workflow.yaml
#   2. Configure: data.input_file, data.columns, model.type, model.name
#   3. Run: nlsq fit my_workflow.yaml
#
# Minimal Configuration:
#   data:
#     input_file: "data/experiment.csv"
#     columns: { x: 0, y: 1 }
#   model:
#     type: "builtin"
#     name: "exponential_decay"
#   export:
#     results_file: "results.json"
#
# `nlsq fit` currently always runs a single local nlsq.curve_fit() call —
# there is no global/multi-start/CMA-ES/streaming/checkpointing workflow
# selector wired up in the CLI yet, so this template does not document one.
# `--workers`/`--summary` for batch mode are CLI flags on `nlsq batch`, not
# YAML keys (a per-file `batch:` section in the YAML is never read).
#
# Requirements: Python >=3.12, JAX >=0.8.0, NumPy >=2.2, SciPy >=1.16.0
# Documentation: https://nlsq.readthedocs.io/
# ==============================================================================

# Workflow metadata (read for logging/labeling only, not fit behavior)
metadata:
  workflow_name: "example_workflow"
  description: "NLSQ workflow configuration"
  version: "1.0"
  author: ""

# ==============================================================================
# DATA
# ==============================================================================
# Dataset configuration for CLI data loading.
# Supports: CSV (.csv), ASCII (.txt, .dat), NPZ (.npz), HDF5 (.h5, .hdf5)

data:
  # Path to data file (required for CLI)
  input_file: "data/experiment.csv"

  # File format: "auto" (from extension), "csv", "ascii", "npz", "hdf5"
  format: "auto"

  # Column selection (0-based index or column name for CSV with header)
  columns:
    x: 0              # Independent variable
    y: 1              # Dependent variable
    z: null           # Optional: enables 2D surface fitting
    sigma: null       # Optional: measurement uncertainties

  # CSV options
  csv:
    delimiter: ","
    header: true
    encoding: "utf-8"
    skip_header: 0    # Skip N rows at start of file
    missing_values: ["", "NA", "null", "NaN"]

  # ASCII options (.txt, .dat)
  ascii:
    delimiter: null   # null = any whitespace
    comment_char: "#"
    skip_header: 0
    skip_footer: 0
    dtype: "float64"

  # NPZ options
  npz:
    x_key: "x"
    y_key: "y"
    z_key: null
    sigma_key: null

  # HDF5 options
  hdf5:
    x_path: "/data/x"
    y_path: "/data/y"
    z_path: null
    sigma_path: null

# Data validation — this is a TOP-LEVEL key, not nested under `data:`
# (the loader merges it into the data config internally).
validation:
  require_finite: true
  min_points: 2

# ==============================================================================
# MODEL
# ==============================================================================
# Model function configuration.
#
# Types:
#   "builtin"    - Use nlsq.core.functions library
#   "custom"     - Load from external Python file
#   "polynomial" - Generate polynomial of specified degree
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ BUILTIN MODELS                                                              │
# ├─────────────────────────────────────────────────────────────────────────────┤
# │ Name               │ Formula                     │ Parameters               │
# ├────────────────────┼─────────────────────────────┼──────────────────────────┤
# │ linear             │ a*x + b                     │ a, b                     │
# │ exponential_decay  │ a*exp(-b*x) + c             │ a, b, c                  │
# │ exponential_growth │ a*exp(b*x) + c              │ a, b, c                  │
# │ gaussian           │ amp*exp(-(x-mu)²/(2σ²))     │ amp, mu, sigma           │
# │ sigmoid            │ L/(1+exp(-k*(x-x0))) + b    │ L, x0, k, b              │
# │ power_law          │ a*x^b                       │ a, b                     │
# │ polynomial(N)      │ c0 + c1*x + ... + cN*x^N    │ c0, c1, ..., cN          │
# └─────────────────────────────────────────────────────────────────────────────┘

model:
  # Model type: "builtin", "custom", "polynomial"
  type: "builtin"

  # Builtin model name (when type: "builtin")
  name: "exponential_decay"

  # --- Custom model (when type: "custom") — flat keys, not nested ---
  # path: "models.py"
  # function: "my_model"
  # trusted: false  # set true only for files you trust (skips AST safety scan)

  # --- Polynomial model (when type: "polynomial") — flat key, not nested ---
  # degree: 3

  # Optional: parameter names for export/result labeling only. This does NOT
  # set initial guesses or bounds — those go under `fitting:` below.
  # parameter_names: ["amplitude", "decay_rate", "offset"]

# ==============================================================================
# FITTING
# ==============================================================================
# Core fitting algorithm configuration. Every key here maps 1:1 to a
# nlsq.curve_fit() keyword argument.

fitting:
  # Initial parameter guess: a list, or "auto"/omit to use the model's
  # estimate_p0() (falls back to nlsq.curve_fit's own default if unavailable).
  p0: "auto"

  # Bounds: either {lower: [...], upper: [...]} or [[lower...], [upper...]].
  # If omitted, falls back to the model's bounds() method if it defines one.
  # bounds:
  #   lower: [0.0, 0.001, -1.0]
  #   upper: [10.0, 1.0, 1.0]

  # Optimization method (omit to let nlsq.curve_fit choose automatically)
  # method: "trf"

  # Convergence tolerances (top-level, not nested under `termination:`)
  gtol: 1.0e-8       # Gradient tolerance (gradient norm)
  ftol: 1.0e-8       # Function tolerance (relative cost reduction)
  xtol: 1.0e-8       # Parameter tolerance (relative parameter change)
  max_nfev: 2000     # Maximum function evaluations

  # Robust loss function for outlier handling.
  # Options: "linear" (default, no robustness), "huber", "soft_l1", "cauchy", "arctan"
  loss: "linear"

  # sigma is treated as an absolute uncertainty (not relative weighting)
  absolute_sigma: false

  # Validate xdata/ydata for NaN/Inf before fitting
  check_finite: true

# ==============================================================================
# EXPORT
# ==============================================================================
# Output configuration.

export:
  # Results file path (required unless using --stdout)
  results_file: "output/fit_results.json"

  # Output format: "json" or "csv" (singular — one format per run)
  format: "json"

# ==============================================================================
# VISUALIZATION
# ==============================================================================
# Publication-quality figure generation (nlsq/cli/visualization.py).

visualization:
  enabled: true
  output_dir: "figures"
  filename_prefix: "fit"

  # Style presets:
  #   "publication"   - Journal-ready (serif fonts, clean)
  #   "presentation"  - Large fonts for slides
  #   "nature"        - Nature journal style
  #   "science"       - Science journal style
  #   "minimal"       - Minimal decoration
  style: "publication"

  figure_size: [6.0, 4.5]
  dpi: 300

  # Output formats (list — one file per format)
  formats:
    - "pdf"
    - "png"

  # Font configuration
  font:
    family: "serif"       # "serif", "sans-serif", "monospace"
    size: 10
    math_fontset: "cm"    # "cm", "stix", "dejavuserif"

  # Plot components
  main_plot:
    title: null           # null = auto-generated
    x_label: null         # null = "x"
    y_label: null         # null = "y"
    show_grid: true
    grid_alpha: 0.3

    data:
      marker: "o"
      size: 20
      alpha: 0.7
      label: "Data"
      show_errorbars: true
      capsize: 2

    fit:
      linewidth: 1.5
      linestyle: "-"
      label: "Fit"
      n_points: 500

    confidence_band:
      enabled: true
      level: 0.95
      alpha: 0.2

    legend:
      enabled: true
      location: "best"
      frameon: true

    annotation:
      enabled: true
      show_r_squared: true
      show_rmse: true
      show_chi_squared: false
      location: "upper right"
      fontsize: 9

  residuals_plot:
    enabled: true
    type: "scatter"       # "scatter", "line", "stem"
    x_label: null         # null = "x"
    y_label: "Residual"
    show_zero_line: true
    marker: "o"
    size: 15
    alpha: 0.7

    std_bands:
      enabled: false
      levels: [1, 2]
      colors: ["#fff3cd", "#ffe69c"]
      alpha: 0.4

  histogram:
    enabled: true
    bins: "auto"
    x_label: null         # null = "Residual"
    show_normal_fit: true
    alpha: 0.7
    edgecolor: "white"
    title: "Residual Distribution"
