# Historical filename: this example performs a bounded local CLI fit.
# Run from examples/scripts/10_cli-commands:
#   nlsq fit workflows/06_global_optimization.yaml
#
# The CLI runner calls curve_fit. Multi-start and CMA-ES require the Python API;
# workflow/global_optimization YAML keys do not select global solvers here.
metadata:
  workflow_name: bounded_damped_oscillator
  description: Bounded local fit with explicit initial guesses

data:
  input_file: data/damped_oscillation.csv
  format: csv
  columns: {x: 0, y: 1, sigma: 2}
  csv:
    header: true
    delimiter: ","
    skip_header: 2

model:
  type: custom
  path: models/physics_models.py
  function: damped_oscillator

fitting:
  p0: [10.0, 0.1, 3.0, 0.5]
  bounds:
    lower: [0.1, 0.001, 0.1, -3.14159]
    upper: [50.0, 1.0, 10.0, 3.14159]
  method: trf
  ftol: 1.0e-10
  xtol: 1.0e-10
  gtol: 1.0e-10
  max_nfev: 300

export:
  results_file: output/06_bounded_fit_results.json

visualization:
  enabled: true
  output_dir: output/figures
  filename_prefix: 06_bounded_fit
  formats: [png, pdf]
  style: publication
