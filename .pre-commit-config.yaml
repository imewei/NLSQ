# Pre-commit configuration
# Updated: 2026-11-01
# Python 3.13 (supports >=3.12), uv package manager
# Tool versions below match uv.lock (ruff, mypy, pyupgrade, bandit)
#
# Package structure:
#   nlsq/core/                - Optimization pipeline (minpack, trf, least_squares, workflow)
#   nlsq/streaming/           - Large dataset handling (large_dataset, adaptive_hybrid, exact_lm)
#   nlsq/caching/             - Memory and JIT caching (memory_manager, unified_cache)
#   nlsq/stability/           - Numerical stability (guard, svd_fallback, recovery, fallback)
#   nlsq/precision/           - Precision controls (parameter_normalizer, algorithm_selector, bound_inference)
#   nlsq/utils/               - Utilities (validators, diagnostics, logging)
#   nlsq/diagnostics/         - Model Health Diagnostics System
#   nlsq/global_optimization/ - Multi-start and CMA-ES global optimization
#   nlsq/result/              - Result types (OptimizeResult, OptimizeWarning)
#   nlsq/cli/                 - Command-line interface
#   nlsq/gui_qt/              - Native Qt desktop application (PySide6)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^graphify-out/  # generated; every `graphify update` rewrites files without a trailing newline
      - id: check-yaml
        exclude: ^conda-recipe/.*/meta\.yaml$|^conda-recipe/meta\.yaml$  # conda meta.yaml uses Jinja2 {%...%} templating, not valid YAML
      - id: check-added-large-files
        args: ['--maxkb=2000']
        exclude: ^graphify-out/
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-docstring-first
      - id: check-json
      - id: check-ast
      - id: mixed-line-ending
      - id: name-tests-test
        args: ['--pytest-test-first']
        exclude: ^tests/(.*/fixtures/|architecture/utils\.py|streaming/exact_lm_kkt\.py)
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3  # Aligned with uv.lock ruff 0.17.3 and pyproject.toml >=0.14.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]  # ruff >=0.17 hooks also match markdown by default
        exclude: '(\.ipynb$|^nlsq/_version\.py$)'  # _version.py auto-generated by setuptools-scm
      - id: ruff-format
        types_or: [python, pyi]  # keep markdown out (blacken-docs formats code blocks in docs)
        exclude: '(\.ipynb$|^nlsq/_version\.py$)'  # _version.py auto-generated by setuptools-scm

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1  # Aligned with uv.lock mypy 2.4.1 and pyproject.toml >=1.19.0
    hooks:
      - id: mypy
        additional_dependencies: [numpy, jax, types-setuptools, scipy, psutil, types-tqdm]
        args: [--python-version=3.13, --check-untyped-defs]
        files: ^nlsq/
        exclude: ^(tests/|examples/|benchmarks/)

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.0
    hooks:
      - id: check-github-workflows

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        args: ['--skip=*.ipynb,*.html', '--ignore-words-list=nd,coo,assertIn,deques']
        exclude: ^graphify-out/

  - repo: https://github.com/adamchainz/blacken-docs
    rev: 1.20.0
    hooks:
      - id: blacken-docs
        additional_dependencies: [black]
        exclude: ^examples/_templates/

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4  # Security linting (low-level checks only)
    hooks:
      - id: bandit
        args: ['-ll', '--skip=B101,B601,B602,B607']
        files: ^nlsq/
        exclude: ^(tests/|examples/|benchmarks/)

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0  # Secret detection to prevent credential leaks
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: '(\.lock$|\.ipynb$|^\.secrets\.baseline$|^graphify-out/)'

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.22.0  # Aligned with uv.lock pyupgrade 3.22.0
    hooks:
      - id: pyupgrade
        args: [--py312-plus]  # lowest supported Python (requires-python >=3.12)
        exclude: ^nlsq/_version\.py$  # Auto-generated by setuptools-scm

  # Local hooks for project-specific checks
  - repo: local
    hooks:
      - id: docs-build
        name: Build Sphinx documentation (warnings as errors)
        entry: bash -c 'cd docs && make html SPHINXOPTS="-W --keep-going -q"'
        language: system
        files: ^(docs/|nlsq/.*\.py$|.*\.md$)
        pass_filenames: false
        stages: [manual]  # Run with: pre-commit run --hook-stage manual docs-build
        # Note: -n (nitpicky mode) disabled as too strict for scientific computing library

      - id: validate-notebooks
        name: Validate Jupyter notebooks configuration
        entry: python scripts/notebooks/configure_notebooks.py --dry-run
        language: system
        files: ^examples/notebooks/.*\.ipynb$
        pass_filenames: false
        stages: [manual]  # Run with: pre-commit run --hook-stage manual validate-notebooks
        # Validates notebooks have proper matplotlib inline and IPython.display imports
        # Use --dry-run to check without modifying files

      - id: configure-notebooks
        name: Configure Jupyter notebooks (auto-fix)
        entry: python scripts/notebooks/configure_notebooks.py --incremental
        language: system
        files: ^examples/notebooks/.*\.ipynb$
        pass_filenames: false
        stages: [manual]  # Run with: pre-commit run --hook-stage manual configure-notebooks
        # Automatically applies transformations: matplotlib inline, IPython.display imports, plt.show() replacement
        # Uses incremental mode to skip unchanged notebooks for better performance
